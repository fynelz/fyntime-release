ShortDescription: Parental controls and family safety for Windows PCs. Enhances or replaces Microsoft Family Safety.
Description: |-
  FynTime Keeper is a parental control and family safety supervision agent for Windows 10 and Windows 11 PCs.
  It helps parents and kids agree on daily screen time budgets, shared gaming pools (across Roblox, Minecraft, and Steam), bedtime curfews, and safe web browsing across Google Chrome and Microsoft Edge.
  FynTime works as a companion alongside Microsoft Family Safety or as a complete replacement on local standard Windows accounts, managed remotely from the FynTime Keeper Android parent app or web console.
